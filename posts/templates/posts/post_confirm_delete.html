{% extends "posts/base.html" %}
{% block content %}
<h1>Eliminar post</h1>
<p>¿Seguro que querés eliminar "{{ post.titulo }}"?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn--danger">Sí, eliminar</button>
    <a class="btn btn--ghost" href="{% url 'detalle_post' post.slug %}">Cancelar</a>
</form>
{% endblock %}
