{% extends "posts/base.html" %}
{% block content %}
<h1>{{ titulo_pagina }}</h1>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn--primary">{{ texto_boton }}</button>
    <a class="btn btn--ghost" href="{% url 'lista_posts' %}">Cancelar</a>
</form>
{% endblock %}
