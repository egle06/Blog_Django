{% extends 'posts/base.html' %}

{% block content %}
    <article class="detalle-post">
        <h1>{{ post.titulo }}</h1>
        <p class="autor"><strong>Autor:</strong> {{ post.autor }}</p>
        <p>{{ post.contenido }}</p>

        <a href="{% url 'lista_posts' %}">&larr; Volver al listado</a>
    </article>
{% endblock %}
