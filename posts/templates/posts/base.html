{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Blog</title>
    <link rel="stylesheet" href="{% static 'posts/css/estilos.css' %}">
</head>
<body>
    <header class="site-header">
        <img src="{% static 'posts/img/logo.jpg' %}" alt="Logo del blog" class="logo">
        <span class="site-title">Mi Blog</span>
        <nav class="site-nav">
            <a href="{% url 'inicio' %}">Inicio</a>
            <a href="{% url 'acerca' %}">Acerca de</a>
            <a href="{% url 'lista_posts' %}">Posts</a>
        </nav>
    </header>

    <main class="site-main">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Mi Blog</p>
    </footer>

    <script src="{% static 'posts/js/main.js' %}"></script>
</body>
</html>
