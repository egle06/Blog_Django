{% extends "posts/base.html" %}

{% block content %}
<h1>Editar perfil</h1>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}

    {{ usuario_form.as_p }}
    {{ perfil_form.as_p }}

    <button type="submit" class="btn btn--primary">Guardar cambios</button>
    <a class="btn btn--ghost" href="{% url 'perfil' %}">Cancelar</a>
</form>
{% endblock %}
