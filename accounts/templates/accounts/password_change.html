{% extends "posts/base.html" %}

{% block content %}
    <h1>Cambiar contraseña</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn--primary">Cambiar contraseña</button>
        <a class="btn btn--ghost" href="{% url 'perfil' %}">Cancelar</a>
    </form>
{% endblock %}
